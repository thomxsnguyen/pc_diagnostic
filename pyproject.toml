[project]
name = "pc-diagnostic"
version = "0.1.0"
description = "A cross-platform PC monitoring and AI-diagnostic tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "crewai>=0.1.0",
    "PySide6>=6.6.0",
    "pyqtgraph>=0.13.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.3.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pyinstaller>=6.0.0",
    "watchfiles>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pc_diagnostic"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
